# Render Blueprint - Backend AI Inference Service
# https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: luggage-detection-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    region: frankfurt  # EU region closest to user
    plan: free  # Upgrade to starter ($7/mo) for 512MB RAM and no sleep
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smart-airport-luggage-web.vercel.app,http://localhost:3000"
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: PYTHONUNBUFFERED
        value: "1"
